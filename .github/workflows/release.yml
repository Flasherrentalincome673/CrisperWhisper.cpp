name: Native release packages

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to package
        required: true
        default: v1.1.1

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  cpu-packages:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            platform: windows-x64
            executable: build/bin/Release/crisper-whisper.exe
            profile: portable
            variant: cpu-portable
            linker_flags: ""
          - os: windows-2022
            platform: windows-x64
            executable: build/bin/Release/crisper-whisper.exe
            profile: balance
            variant: cpu-avx2
            linker_flags: ""
          - os: ubuntu-22.04
            platform: linux-x64
            executable: build/bin/crisper-whisper
            profile: portable
            variant: cpu-portable
            linker_flags: -static-libgcc -static-libstdc++
          - os: ubuntu-22.04
            platform: linux-x64
            executable: build/bin/crisper-whisper
            profile: balance
            variant: cpu-avx2
            linker_flags: -static-libgcc -static-libstdc++
          - os: ubuntu-22.04-arm
            platform: linux-arm64
            executable: build/bin/crisper-whisper
            profile: portable
            variant: cpu-portable
            linker_flags: -static-libgcc -static-libstdc++
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.platform }} / ${{ matrix.profile }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Configure
        shell: bash
        run: >-
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DCRISPERWHISPER_CUDA=OFF
          -DCRISPERWHISPER_CPU_PROFILE=${{ matrix.profile }}
          -DCRISPERWHISPER_BUILD_TESTS=ON
          -DCRISPERWHISPER_BUILD_BENCHMARKS=OFF
          -DCRISPERWHISPER_STATIC_MSVC_RUNTIME=ON
          -DCMAKE_EXE_LINKER_FLAGS="${{ matrix.linker_flags }}"

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Verify Linux release ABI
        if: runner.os == 'Linux'
        shell: bash
        run: |
          binary="${{ matrix.executable }}"
          ldd "${binary}"

          if ldd "${binary}" | grep -q "libstdc++"; then
            echo "The Linux release still dynamically depends on libstdc++." >&2
            exit 1
          fi

          max_glibc="$(
            readelf --version-info "${binary}" |
              grep -oE 'GLIBC_[0-9]+(\.[0-9]+)*' |
              sort -Vu |
              tail -1
          )"
          echo "Maximum required GLIBC symbol: ${max_glibc}"

          if [[ "$(
            printf '%s\n' "GLIBC_2.35" "${max_glibc}" |
              sort -V |
              tail -1
          )" != "GLIBC_2.35" ]]; then
            echo "Linux release requires newer than GLIBC 2.35." >&2
            exit 1
          fi

      - name: Download ARM64 Turbo smoke-test model
        if: matrix.platform == 'linux-arm64'
        shell: bash
        run: |
          mkdir -p .arm-smoke
          curl --location --fail --retry 3 \
            --output .arm-smoke/ggml-crisperwhisper-turbo-f16.bin \
            "https://huggingface.co/drbaph/CrisperWhisper2.0-GGML/resolve/main/ggml-crisperwhisper-turbo-f16.bin?download=true"

      - name: Create ARM64 repeated-speech regression audio
        if: matrix.platform == 'linux-arm64'
        shell: bash
        run: |
          python3 - <<'PY'
          import wave

          with wave.open("samples/jfk.wav", "rb") as source:
              parameters = source.getparams()
              frames = source.readframes(source.getnframes())

          with wave.open(".arm-smoke/jfk-5x.wav", "wb") as target:
              target.setparams(parameters)
              for _ in range(5):
                  target.writeframes(frames)
          PY

      - name: Run ARM64 long-form timestamp regression
        if: matrix.platform == 'linux-arm64'
        shell: bash
        run: |
          test "$(uname -m)" = "aarch64"
          "${{ matrix.executable }}" \
            --model .arm-smoke/ggml-crisperwhisper-turbo-f16.bin \
            --file .arm-smoke/jfk-5x.wav \
            --mode verbatim \
            --language en \
            --word-timestamps \
            --json > .arm-smoke/result.json
          python3 - <<'PY'
          import json

          with open(".arm-smoke/result.json", encoding="utf-8") as handle:
              result = json.load(handle)

          words = result.get("words", [])
          chunks = result.get("chunks", [])
          text = result.get("text", "")
          if len(words) != 110:
              raise SystemExit(
                  f"Expected 110 timed words from five JFK copies, got {len(words)}"
              )
          if len(chunks) != 2:
              raise SystemExit(f"Expected two long-form chunks, got {len(chunks)}")
          if text.count("Americans") != 5 or text.lower().count("country") != 10:
              raise SystemExit("Repeated speech was lost or duplicated at the seam")
          if any(float(word["start"]) > float(word["end"]) for word in words):
              raise SystemExit("ARM64 regression emitted an invalid word timestamp")

          maximum_gap = 0.0
          for previous, current in zip(words, words[1:]):
              if float(current["start"]) < float(previous["end"]):
                  raise SystemExit("ARM64 regression emitted overlapping timestamps")
              maximum_gap = max(
                  maximum_gap,
                  float(current["start"]) - float(previous["end"]),
              )
              if (
                  current["word"].casefold() == previous["word"].casefold()
                  and abs(float(current["start"]) - float(previous["start"])) <= 0.12
              ):
                  raise SystemExit("ARM64 regression emitted an adjacent duplicate")
          if maximum_gap > 5.0:
              raise SystemExit(
                  f"ARM64 regression contains a {maximum_gap:.2f}s timestamp hole"
              )

          print(
              "ARM64 repeated-speech regression passed: "
              f"{len(words)} words, {len(chunks)} chunks, "
              f"maximum gap {maximum_gap:.2f}s"
          )
          PY

      - name: Stage Windows package
        if: runner.os == 'Windows'
        shell: pwsh
        run: >-
          ./scripts/package-windows.ps1
          -BuildDirectory build
          -Variant ${{ matrix.variant }}
          -Version $env:RELEASE_TAG
          -OutputDirectory package

      - name: Stage Linux package
        if: runner.os == 'Linux'
        shell: bash
        run: |
          package="crisperwhisper-${RELEASE_TAG}-${{ matrix.platform }}-${{ matrix.variant }}"
          mkdir -p "package/${package}/samples"
          cp "${{ matrix.executable }}" "package/${package}/"
          cp README.md \
            CPP.md \
            BUILD_LINUX.md \
            LICENSE \
            crisperwhispercpp.png \
            "package/${package}/"
          cp samples/jfk.wav samples/README.md samples/LICENSE.whisper.cpp \
            "package/${package}/samples/"
          (
            cd package
            cmake -E tar cf "${package}.zip" --format=zip "${package}"
          )

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.platform }}-${{ matrix.profile }}
          path: package/*.zip
          if-no-files-found: error

  cuda-package:
    runs-on: windows-2022
    name: windows-x64 / CUDA RTX 30-40-50
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Install CUDA Toolkit 12.8
        uses: Jimver/cuda-toolkit@3d45d157f327c09c04b50ee6ccdea2d9d017ec76 # v0.2.35
        with:
          cuda: "12.8.1"
          method: network
          sub-packages: >-
            ["nvcc", "cudart", "cublas", "cublas_dev", "thrust",
            "nvjitlink"]
          use-github-cache: false
          use-local-cache: false
          log-file-suffix: windows-cuda-12.8.1

      - name: Build and test CUDA release
        shell: pwsh
        run: |
          ./scripts/build.ps1 `
            -BuildDirectory build `
            -Configuration Release `
            -CudaArchitectures "86;89;120" `
            -CpuProfile balance

      - name: Stage Windows CUDA package
        shell: pwsh
        run: >-
          ./scripts/package-windows.ps1
          -BuildDirectory build
          -Variant cuda-rtx30-40-50
          -Version $env:RELEASE_TAG
          -OutputDirectory package

      - uses: actions/upload-artifact@v7
        with:
          name: windows-x64-cuda-rtx30-40-50
          path: package/*.zip
          if-no-files-found: error

  linux-cuda-package:
    runs-on: ubuntu-22.04
    name: linux-x64 / CUDA RTX 30-40-50
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Check out current release documentation
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.sha || env.RELEASE_TAG }}
          path: .release-metadata

      - name: Install CUDA Toolkit 12.8
        uses: Jimver/cuda-toolkit@3d45d157f327c09c04b50ee6ccdea2d9d017ec76 # v0.2.35
        with:
          cuda: "12.8.1"
          method: network
          sub-packages: >-
            ["nvcc", "cudart", "cudart-dev", "driver-dev", "cccl"]
          non-cuda-sub-packages: >-
            ["libcublas", "libcublas-dev", "libnvjitlink",
            "libnvjitlink-dev"]
          use-github-cache: false
          use-local-cache: false
          log-file-suffix: linux-cuda-12.8.1

      - name: Install packaging tool
        shell: bash
        run: sudo apt-get install --yes patchelf

      - name: Build and test Linux CUDA release
        shell: bash
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCRISPERWHISPER_CUDA=ON \
            -DCRISPERWHISPER_CPU_PROFILE=balance \
            -DCRISPERWHISPER_BUILD_TESTS=ON \
            -DCRISPERWHISPER_BUILD_BENCHMARKS=OFF \
            -DCMAKE_CUDA_ARCHITECTURES="86;89;120" \
            -DCMAKE_EXE_LINKER_FLAGS="-static-libgcc -static-libstdc++"
          cmake --build build --config Release --parallel
          ctest --test-dir build -C Release --output-on-failure

      - name: Stage and verify Linux CUDA package
        shell: bash
        run: |
          package="crisperwhisper-${RELEASE_TAG}-linux-x64-cuda-rtx30-40-50"
          package_dir="package/${package}"
          mkdir -p "${package_dir}/lib" "${package_dir}/samples"

          cp build/bin/crisper-whisper "${package_dir}/"
          cp .release-metadata/README.md \
            .release-metadata/BUILD_LINUX.md \
            "${package_dir}/"
          cp CPP.md \
            LICENSE \
            crisperwhispercpp.png \
            "${package_dir}/"
          cp samples/jfk.wav samples/README.md samples/LICENSE.whisper.cpp \
            "${package_dir}/samples/"

          cuda_library_dir="${CUDA_PATH}/targets/x86_64-linux/lib"
          for soname in \
            libcudart.so.12 \
            libcublas.so.12 \
            libcublasLt.so.12 \
            libnvJitLink.so.12
          do
            source_path="$(
              find "${cuda_library_dir}" -name "${soname}" -print -quit
            )"
            if [[ -z "${source_path}" ]]; then
              echo "Required CUDA runtime library was not found: ${soname}" >&2
              exit 1
            fi
            cp -L "${source_path}" "${package_dir}/lib/${soname}"
          done

          cat > "${package_dir}/NVIDIA-CUDA-RUNTIME-NOTICE.txt" <<'EOF'
          This package includes NVIDIA CUDA Runtime, cuBLAS, cuBLASLt, and
          nvJitLink redistributable components. Those files remain governed by
          the NVIDIA CUDA Toolkit End User License Agreement:
          https://docs.nvidia.com/cuda/eula/index.html

          An NVIDIA display driver compatible with CUDA 12.8 is required.
          The CUDA Toolkit is not required to run this prebuilt package.
          EOF

          patchelf --force-rpath \
            --set-rpath '$ORIGIN/lib' \
            "${package_dir}/crisper-whisper"

          dependency_report="$(
            env -u LD_LIBRARY_PATH ldd "${package_dir}/crisper-whisper"
          )"
          printf '%s\n' "${dependency_report}"
          if grep -q "not found" <<<"${dependency_report}"; then
            echo "The packaged executable has an unresolved dependency." >&2
            exit 1
          fi
          for soname in \
            libcudart.so.12 \
            libcublas.so.12 \
            libcublasLt.so.12
          do
            if ! grep -F "${package_dir}/lib/${soname}" \
              <<<"${dependency_report}" >/dev/null
            then
              echo "${soname} did not resolve from the package." >&2
              exit 1
            fi
          done

          if ldd "${package_dir}/crisper-whisper" | grep -q "libstdc++"; then
            echo "The Linux CUDA executable depends on dynamic libstdc++." >&2
            exit 1
          fi

          max_glibc="$(
            readelf --version-info "${package_dir}/crisper-whisper" |
              grep -oE 'GLIBC_[0-9]+(\.[0-9]+)*' |
              sort -Vu |
              tail -1
          )"
          echo "Maximum required executable GLIBC symbol: ${max_glibc}"
          if [[ "$(
            printf '%s\n' "GLIBC_2.35" "${max_glibc}" |
              sort -V |
              tail -1
          )" != "GLIBC_2.35" ]]; then
            echo "Linux CUDA release requires newer than GLIBC 2.35." >&2
            exit 1
          fi

          env -u LD_LIBRARY_PATH \
            "${package_dir}/crisper-whisper" --help >/dev/null
          (
            cd package
            cmake -E tar cf "${package}.zip" --format=zip "${package}"
          )

      - uses: actions/upload-artifact@v7
        with:
          name: linux-x64-cuda-rtx30-40-50
          path: package/*.zip
          if-no-files-found: error

  publish:
    needs: [cpu-packages, cuda-package, linux-cuda-package]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.sha || env.RELEASE_TAG }}

      - uses: actions/download-artifact@v8
        with:
          pattern: "*"
          path: release-assets
          merge-multiple: true

      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          generate_release_notes: true
          body_path: RELEASE_NOTES.md
          overwrite_files: true
          files: |
            release-assets/*.zip
