name: Native release packages

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to package
        required: true
        default: v1.1.0

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  cpu-packages:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows-x64
            executable: build/bin/Release/crisper-whisper.exe
            profile: portable
            variant: cpu-portable
            linker_flags: ""
          - os: windows-latest
            platform: windows-x64
            executable: build/bin/Release/crisper-whisper.exe
            profile: balance
            variant: cpu-avx2
            linker_flags: ""
          - os: ubuntu-22.04
            platform: linux-x64
            executable: build/bin/crisper-whisper
            profile: portable
            variant: cpu-portable
            linker_flags: -static-libgcc -static-libstdc++
          - os: ubuntu-22.04
            platform: linux-x64
            executable: build/bin/crisper-whisper
            profile: balance
            variant: cpu-avx2
            linker_flags: -static-libgcc -static-libstdc++
          - os: ubuntu-22.04-arm
            platform: linux-arm64
            executable: build/bin/crisper-whisper
            profile: portable
            variant: cpu-portable
            linker_flags: -static-libgcc -static-libstdc++
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.platform }} / ${{ matrix.profile }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Check out current release documentation
        if: >-
          github.event_name == 'workflow_dispatch' &&
          matrix.platform == 'linux-arm64'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: release-docs

      - name: Configure
        shell: bash
        run: >-
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DCRISPERWHISPER_CUDA=OFF
          -DCRISPERWHISPER_CPU_PROFILE=${{ matrix.profile }}
          -DCRISPERWHISPER_BUILD_TESTS=ON
          -DCRISPERWHISPER_BUILD_BENCHMARKS=OFF
          -DCRISPERWHISPER_STATIC_MSVC_RUNTIME=ON
          -DCMAKE_EXE_LINKER_FLAGS="${{ matrix.linker_flags }}"

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Verify Linux release ABI
        if: runner.os == 'Linux'
        shell: bash
        run: |
          binary="${{ matrix.executable }}"
          ldd "${binary}"

          if ldd "${binary}" | grep -q "libstdc++"; then
            echo "The Linux release still dynamically depends on libstdc++." >&2
            exit 1
          fi

          max_glibc="$(
            readelf --version-info "${binary}" |
              grep -oE 'GLIBC_[0-9]+(\.[0-9]+)*' |
              sort -Vu |
              tail -1
          )"
          echo "Maximum required GLIBC symbol: ${max_glibc}"

          if [[ "$(
            printf '%s\n' "GLIBC_2.35" "${max_glibc}" |
              sort -V |
              tail -1
          )" != "GLIBC_2.35" ]]; then
            echo "Linux release requires newer than GLIBC 2.35." >&2
            exit 1
          fi

      - name: Download ARM64 Turbo smoke-test model
        if: matrix.platform == 'linux-arm64'
        shell: bash
        run: |
          mkdir -p .arm-smoke
          curl --location --fail --retry 3 \
            --output .arm-smoke/ggml-crisperwhisper-turbo-f16.bin \
            "https://huggingface.co/drbaph/CrisperWhisper2.0-GGML/resolve/main/ggml-crisperwhisper-turbo-f16.bin?download=true"

      - name: Run ARM64 model inference smoke test
        if: matrix.platform == 'linux-arm64'
        shell: bash
        run: |
          test "$(uname -m)" = "aarch64"
          "${{ matrix.executable }}" \
            --model .arm-smoke/ggml-crisperwhisper-turbo-f16.bin \
            --file samples/jfk.wav \
            --mode verbatim \
            --language en \
            --word-timestamps \
            --json > .arm-smoke/result.json
          python3 - <<'PY'
          import json

          with open(".arm-smoke/result.json", encoding="utf-8") as handle:
              result = json.load(handle)

          words = result.get("words", [])
          if len(words) < 10:
              raise SystemExit(f"ARM64 smoke test emitted only {len(words)} words")
          if any(float(word["start"]) > float(word["end"]) for word in words):
              raise SystemExit("ARM64 smoke test emitted an invalid word timestamp")
          if "fellow Americans" not in result.get("text", ""):
              raise SystemExit("ARM64 Turbo smoke-test transcript did not match JFK")

          print(f"ARM64 Turbo smoke test passed with {len(words)} timed words")
          PY

      - name: Stage Windows package
        if: runner.os == 'Windows'
        shell: pwsh
        run: >-
          ./scripts/package-windows.ps1
          -BuildDirectory build
          -Variant ${{ matrix.variant }}
          -Version $env:RELEASE_TAG
          -OutputDirectory package

      - name: Stage Linux package
        if: runner.os == 'Linux'
        shell: bash
        run: |
          package="crisperwhisper-${RELEASE_TAG}-${{ matrix.platform }}-${{ matrix.variant }}"
          docs_root="."
          if [[ -d release-docs ]]; then
            docs_root="release-docs"
          fi
          mkdir -p "package/${package}/samples"
          cp "${{ matrix.executable }}" "package/${package}/"
          cp "${docs_root}/README.md" \
            "${docs_root}/CPP.md" \
            "${docs_root}/BUILD_LINUX.md" \
            "${docs_root}/LICENSE" \
            "${docs_root}/crisperwhispercpp.png" \
            "package/${package}/"
          cp samples/jfk.wav samples/README.md samples/LICENSE.whisper.cpp \
            "package/${package}/samples/"
          (
            cd package
            cmake -E tar cf "${package}.zip" --format=zip "${package}"
          )

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}-${{ matrix.profile }}
          path: package/*.zip
          if-no-files-found: error

  publish:
    needs: cpu-packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: "*"
          path: release-assets
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          generate_release_notes: true
          files: |
            release-assets/*.zip
