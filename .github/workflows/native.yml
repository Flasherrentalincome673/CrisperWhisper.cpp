name: Native C++

on:
  workflow_dispatch:
  push:
    paths:
      - "CMakeLists.txt"
      - "include/**"
      - "src/**"
      - "tests/cpp/**"
      - "benchmarks/**"
      - ".github/workflows/native.yml"
  pull_request:
    paths:
      - "CMakeLists.txt"
      - "include/**"
      - "src/**"
      - "tests/cpp/**"
      - "benchmarks/**"
      - ".github/workflows/native.yml"

jobs:
  cpu-build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        cpu-profile: [portable, balance, fast]
    runs-on: ${{ matrix.os }}
    name: CPU ${{ matrix.cpu-profile }} / ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: >-
          cmake -S . -B build
          -DCRISPERWHISPER_CUDA=OFF
          -DCRISPERWHISPER_CPU_PROFILE=${{ matrix.cpu-profile }}
          -DCRISPERWHISPER_BUILD_TESTS=ON
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

  arm64-build:
    runs-on: ubuntu-24.04-arm
    name: ARM64 CPU portable / ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: >-
          cmake -S . -B build
          -DCRISPERWHISPER_CUDA=OFF
          -DCRISPERWHISPER_CPU_PROFILE=portable
          -DCRISPERWHISPER_BUILD_TESTS=ON
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
